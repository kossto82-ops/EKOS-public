# Prometheus for the `observability` compose profile.
#
# SPDX-License-Identifier: Apache-2.0
#
# Scrapes the collector's Prometheus exporter rather than the application: EKOS
# exposes no /metrics endpoint of its own and deliberately pushes OTLP instead, so
# the collector stays the single place that knows where telemetry goes.

global:
  # Matches the app's 15s metric export interval (OTEL_METRIC_EXPORT_INTERVAL_MS in
  # src/server/otel.ts). Scraping faster only re-reads the same values; scraping
  # slower loses samples the 10-minute rate windows in alerts.yaml depend on.
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: ekos-vm

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health. A collector that is dropping batches makes every
  # other series here quietly incomplete, and EkosNoTelemetry cannot distinguish
  # that from the app being down.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
